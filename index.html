<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine 💖</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(to bottom, #ffb6c1, #ffe6eb);
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}

.card {
  background: white;
  padding: 32px 22px;
  border-radius: 20px;
  text-align: center;
  width: 90%;
  max-width: 360px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.15);
}

.anniversary {
  font-size: 18px;
  color: #ad1457;
  margin-bottom: 10px;
}

h1 {
  color: #c2185b;
  font-size: 24px;
  margin-top: 5px;
}

p {
  color: #880e4f;
  margin-bottom: 28px;
}

.buttons {
  position: relative;
  height: 120px;
}

button {
  font-size: 18px;
  padding: 14px 26px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.25s ease;
}

.yes {
  background: #ff4081;
  color: white;
}

.no {
  background: #f8bbd0;
  color: #880e4f;
  position: absolute;
  right: 0;
  top: 0;
}
</style>
</head>

<body>

<div class="card" id="card">
  <div class="anniversary">Happy Anniversary Tingya ✨🥂</div>

  <h1>Will you be my Valentine? 💘</h1>
  <p>I promise snacks, laughs, and endless love 💕</p>

  <div class="buttons">
    <button class="yes" id="yesBtn">Yes 💖</button>
    <button class="no" id="noBtn">No 😳</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

function moveNoButton() {
  // MUCH larger movement
  const maxX = 220;
  const maxY = 120;

  const x = Math.random() * maxX * (Math.random() > 0.5 ? 1 : -1);
  const y = Math.random() * maxY * (Math.random() > 0.5 ? 1 : -1);

  noBtn.style.transform = `translate(${x}px, ${y}px)`;
}

// Works on iPhone + WhatsApp
noBtn.addEventListener("click", moveNoButton);
noBtn.addEventListener("touchstart", moveNoButton);

yesBtn.addEventListener("click", () => {
  document.getElementById("card").innerHTML = `
    <h1>YAY!! 🎉💖</h1>
    <p>Best decision ever 🥰<br>I love you 💕</p>
    <img src="https://media.giphy.com/media/l4FGpP4lxGGgK5CBW/giphy.gif" width="200">
  `;
});
</script>

</body>
</html>
